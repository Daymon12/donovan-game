<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Donovan's Games</title>

  <!-- Home-screen app setup (iPad "Add to Home Screen") -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Donovan">
  <meta name="theme-color" content="#0f1230">
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <!-- The 3D view, with the buttons and menus on top of it -->
  <div id="stage">
    <canvas id="view"></canvas>
    <div id="ui"></div>
  </div>

  <!-- Babylon.js (3D engine) is kept in the project so the game works offline -->
  <script src="lib/babylon.js"></script>
  <script src="lib/babylonjs.loaders.min.js"></script>
  <script type="module" src="src/main.js"></script>

  <script>
    // Save all game files on the device so it plays offline.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
