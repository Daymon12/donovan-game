<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Donovan's Games</title>

  <!-- Home-screen app setup (iPad "Add to Home Screen") -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Donovan">
  <meta name="theme-color" content="#1b1f3b">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #1b1f3b;
      overflow: hidden;
      /* stop iPad text selection, long-press menus and double-tap zoom */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }
    #game { width: 100vw; height: 100vh; height: 100dvh; }
  </style>
</head>
<body>
  <div id="game"></div>

  <!-- Phaser is kept in the project so the game works offline -->
  <script src="lib/phaser.min.js"></script>
  <script type="module" src="src/main.js"></script>

  <script>
    // Save all game files on the device so it plays offline.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
